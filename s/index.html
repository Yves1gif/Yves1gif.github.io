<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockStart</title>
<meta name="apple-itunes-app" content="app-id=6821699664">
<style>
  :root { color-scheme: light dark; --bg:#F5F5F7; --card:#FFFFFF; --text:#1D1D1F; --sub:#6E6E73; --brand:#0F7A55; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1C1C1E; --text:#F5F5F7; --sub:#98989D; --brand:#34C78A; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:28px; padding:36px 28px; max-width:380px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .icon { width:96px; height:96px; border-radius:22px; }
  h1 { font-size:28px; margin:18px 0 6px; letter-spacing:-.02em; }
  .sym { font-size:15px; color:var(--sub); font-weight:600; }
  p { color:var(--sub); font-size:16px; line-height:1.4; }
  a.btn { display:block; margin-top:14px; padding:15px; border-radius:16px; font-weight:600; font-size:17px; text-decoration:none; }
  .primary { background:var(--brand); color:#fff; }
  .secondary { background:rgba(120,120,128,.14); color:var(--text); }
</style>
</head>
<body>
<div class="card">
  <svg class="icon" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#2B3F8F"/><stop offset="1" stop-color="#0B1233"/></linearGradient></defs><rect width="1024" height="1024" rx="229" fill="url(#g)"/><g stroke-linecap="round"><line x1="282" y1="404" x2="282" y2="786" stroke="#FF8E7C" stroke-width="30"/><rect x="212" y="470" width="140" height="228" rx="34" fill="#F06A58"/><line x1="512" y1="300" x2="512" y2="720" stroke="#5BF2B8" stroke-width="30"/><rect x="442" y="390" width="140" height="244" rx="34" fill="#2ED39A"/><line x1="742" y1="190" x2="742" y2="600" stroke="#5BF2B8" stroke-width="30"/><rect x="672" y="250" width="140" height="290" rx="34" fill="#2ED39A"/></g></svg>
  <h1 id="title">A stock for you</h1>
  <div class="sym" id="sym"></div>
  <p id="text">Someone shared a stock with you. Open it in StockStart to see the live price, the chart and what the company does.</p>
  <a class="btn primary" id="open" href="stockstart://">Open in StockStart</a>
  <a class="btn secondary" id="get" href="https://apps.apple.com/app/id6821699664">Get StockStart</a>
</div>
<script>
  const q = (new URLSearchParams(location.search).get("q") || "").toUpperCase().replace(/[^A-Z0-9.\-^=]/g, "").slice(0, 20);
  const de = (navigator.language || "").toLowerCase().startsWith("de");
  if (de) {
    document.documentElement.lang = "de";
    document.getElementById("title").textContent = "Eine Aktie für dich";
    document.getElementById("text").textContent = "Jemand hat dir eine Aktie geteilt. Öffne sie in StockStart und sieh den Live-Kurs, den Chart und was die Firma macht.";
    document.getElementById("open").textContent = "In StockStart öffnen";
    document.getElementById("get").textContent = "StockStart laden";
  }
  if (q) {
    document.getElementById("sym").textContent = q;
    document.getElementById("open").href = "stockstart://stock/" + encodeURIComponent(q);
  }
</script>
</body>
</html>
